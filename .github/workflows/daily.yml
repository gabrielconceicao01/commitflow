name: CommitFlow - Automação diária

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: write

jobs:
  verificar:
    name: Testes, qualidade e commit diário
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Criar pasta de relatórios
        run: mkdir -p reports

      - name: Verificar qualidade do código
        id: lint
        continue-on-error: true
        run: ruff check src tests

      - name: Executar testes automatizados
        id: tests
        continue-on-error: true
        run: python -m pytest -v tests --junitxml=reports/test-results.xml

      - name: Gerar relatório
        if: always()
        env:
          TEST_STATUS: ${{ steps.tests.outcome }}
          LINT_STATUS: ${{ steps.lint.outcome }}
        run: python -m src.generate_report

      - name: Salvar relatórios
        if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily_report.json reports/test-results.xml

          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar relatórios do CommitFlow"
            git push
          else
            echo "Os relatórios não mudaram."
          fi

      - name: Registrar commit diário
        if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        env:
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
        run: |
          if [ -z "$GIT_EMAIL" ]; then
            echo "Configure o segredo GIT_EMAIL nas configurações do repositório."
            exit 1
          fi

          git config user.name "gabrielconceicao01"
          git config user.email "$GIT_EMAIL"

          mkdir -p activity
          date -u +%F >> activity/daily-activity.txt

          git add activity/daily-activity.txt

          if ! git diff --cached --quiet; then
            git commit -m "chore: registro diário de atividade"
            git push
          else
            echo "A atividade de hoje já foi registrada."
          fi

      - name: Validar resultado final
        if: always()
        env:
          TEST_STATUS: ${{ steps.tests.outcome }}
          LINT_STATUS: ${{ steps.lint.outcome }}
        run: |
          if [ "$TEST_STATUS" != "success" ] || [ "$LINT_STATUS" != "success" ]; then
            echo "Falha nos testes ou na análise de qualidade."
            exit 1
          fi

          echo "Testes e análise de qualidade concluídos com sucesso."
